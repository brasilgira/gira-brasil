<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo — Gira Brasil</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- Header — mesmo padrão das outras páginas do site.
       Se o teu header real (index.html, noticias.html etc.) tiver uma
       marcação diferente, substitui este bloco pelo mesmo HTML das
       outras páginas, mantendo a classe "header-acoes" no container da
       direita — é nela que auth.js injeta o mini-perfil e o link Admin. -->
<header class="header-site">
  <div class="header-inner">
    <a href="index.html" class="logo-site">Gira-Brasil</a>

    <nav class="nav-site">
      <a href="index.html">Início</a>
      <a href="noticias.html">Notícias</a>
      <a href="regioes.html">Regiões</a>
      <a href="jogos.html">Jogos</a>
      <a href="girabot.html">Gira-Bot</a>
      <a href="sobre.html">Sobre</a>
    </nav>

    <div class="header-acoes">
      <a href="login.html" class="link-entrar">Entrar</a>
      <a href="cadastro.html" class="botao botao-primario">Criar conta</a>
    </div>
  </div>
</header>

  <main class="admin-main">
    <h1 class="admin-titulo">Painel Administrativo</h1>
    <p class="admin-subtitulo">Gerencie notícias e comentários publicados na plataforma.</p>

    <div id="admin-aviso" class="admin-aviso" hidden></div>

    <nav class="admin-abas" aria-label="Seções do painel">
      <button class="admin-aba admin-aba--ativa" data-aba="noticias" type="button">Notícias</button>
      <button class="admin-aba" data-aba="comentarios" type="button">Comentários</button>
    </nav>

    <section id="painel-noticias" class="admin-painel">
      <table class="admin-tabela">
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Região</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabela-noticias-corpo">
          <tr>
            <td colspan="4" class="admin-vazio">Carregando notícias…</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section id="painel-comentarios" class="admin-painel" hidden>
      <table class="admin-tabela">
        <thead>
          <tr>
            <th>Comentário</th>
            <th>Autor</th>
            <th>Notícia</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-comentarios-corpo">
          <tr>
            <td colspan="4" class="admin-vazio">Carregando comentários…</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Modal de edição de notícia -->
  <div id="modal-editar-noticia" class="admin-modal" hidden>
    <div class="admin-modal-caixa">
      <h2>Editar notícia</h2>
      <label class="admin-modal-label" for="modal-noticia-titulo">Título</label>
      <input id="modal-noticia-titulo" type="text" />
      <label class="admin-modal-label" for="modal-noticia-conteudo">Conteúdo</label>
      <textarea id="modal-noticia-conteudo" rows="6"></textarea>
      <div class="admin-modal-acoes">
        <button id="modal-noticia-cancelar" type="button" class="botao-secundario">Cancelar</button>
        <button id="modal-noticia-salvar" type="button" class="botao-primario">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal de edição de comentário -->
  <div id="modal-editar-comentario" class="admin-modal" hidden>
    <div class="admin-modal-caixa">
      <h2>Editar comentário</h2>
      <textarea id="modal-editar-texto" rows="4"></textarea>
      <div class="admin-modal-acoes">
        <button id="modal-editar-cancelar" type="button" class="botao-secundario">Cancelar</button>
        <button id="modal-editar-salvar" type="button" class="botao-primario">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
